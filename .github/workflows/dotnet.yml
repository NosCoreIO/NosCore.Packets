name: .NET

on:
  push:
    branches: [ master ]
    tags:
      - '*.*.*'
  pull_request:
    branches: [ master ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release from the selected branch, as X.Y.Z'
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '11.0.x'

    - name: Run Unit Tests
      run: |
        dotnet restore
        dotnet build
        dotnet test test/NosCore.Packets.Tests -v m

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '11.0.x'

    - name: Check version
      id: check-tag
      env:
        INPUT_VERSION: ${{ inputs.version }}
      run: |
        if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            VERSION="$INPUT_VERSION"
        else
            VERSION="${GITHUB_REF#refs/tags/}"
        fi
        if [[ "$VERSION" =~ ^[0-9]+[.][0-9]+[.][0-9]+$ ]]; then
            echo "match=true" >> $GITHUB_OUTPUT
            echo "version=$VERSION" >> $GITHUB_OUTPUT
        elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "::error::version must be X.Y.Z, got '$VERSION'"
            exit 1
        fi

    - name: NuGet login
      if: steps.check-tag.outputs.match == 'true'
      id: nuget-login
      uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
      with:
        user: 0Lucifer0

    - name: Pack and push to NuGet
      if: steps.check-tag.outputs.match == 'true'
      id: build_artifact
      env:
        VERSION: ${{ steps.check-tag.outputs.version }}
      run: |
        dotnet restore
        dotnet build -c Release
        dotnet pack -c Release -o /tmp/nupkgs -v m -p:IncludeSymbols=true -p:SymbolPackageFormat=snupkg -p:PackageVersion=${VERSION}
        dotnet nuget push /tmp/nupkgs/NosCore.Packets.${VERSION}.nupkg -s https://api.nuget.org/v3/index.json -k ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --skip-duplicate
        echo "ARTIFACT_PATH=/tmp/nupkgs/NosCore.Packets.${VERSION}.nupkg" >> $GITHUB_OUTPUT

    - name: Tag the released commit
      if: steps.check-tag.outputs.match == 'true' && github.event_name == 'workflow_dispatch'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        VERSION: ${{ steps.check-tag.outputs.version }}
      run: |
        existing=$(git ls-remote --tags "https://github.com/$GITHUB_REPOSITORY" "refs/tags/$VERSION" | cut -f1)
        if [[ -z "$existing" ]]; then
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$VERSION" -f sha="$GITHUB_SHA"
        elif [[ "$existing" != "$GITHUB_SHA" ]]; then
            echo "::error::tag $VERSION already exists on $existing, not on $GITHUB_SHA"
            exit 1
        fi

    - name: Upload Release Asset
      if: steps.check-tag.outputs.match == 'true'
      uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
      with:
        tag_name: ${{ steps.check-tag.outputs.version }}
        files: ${{ steps.build_artifact.outputs.ARTIFACT_PATH }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
